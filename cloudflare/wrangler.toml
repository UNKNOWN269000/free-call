# FreeCall on Cloudflare — Workers + Durable Objects
# Deploy:  cd cloudflare && npm install && npx wrangler deploy
# Dev:     cd cloudflare && npx wrangler dev

name = "freecall"
main = "src/index.js"
compatibility_date = "2026-08-01"

# The web app (index.html, app.js, style.css) lives in ../public and is
# served by the Worker as static assets. Requests that match an asset are
# served directly; everything else (/api, /room, /health) hits the Worker.
[assets]
directory = "../public"
binding = "ASSETS"

# One Durable Object per call room. It owns the room's WebSocket connections
# (using hibernation, so idle rooms cost ~nothing) and its tiny bit of state.
[[durable_objects.bindings]]
name = "CALL_ROOM"
class_name = "CallRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CallRoom"]

[observability]
enabled = true
